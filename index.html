<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TK Studio V5 | 视频拆解工作台</title><meta name="tk-api-base" content=""><style>*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,sans-serif;background:#f5f7fb;color:#18243a}aside{position:fixed;width:220px;inset:0 auto 0 0;background:white;border-right:1px solid #e3e8ef;padding:24px 15px}h2,h3,p{margin:0 0 14px}aside h2{font-size:22px;color:#2857d9}nav button{display:block;width:100%;text-align:left;background:white;color:#536078;border:0;margin:5px 0;padding:12px;border-radius:8px}nav button.active{background:#eaf0ff;color:#2857d9}main{margin-left:220px;padding:28px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:26px;margin:0}small,.muted{color:#748198}section,.card{background:white;border:1px solid #e3e8ef;border-radius:12px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.two{display:grid;grid-template-columns:1fr 2fr;gap:16px}.num{font-size:30px;font-weight:700;color:#2456db}button{cursor:pointer;border:0;border-radius:7px;background:#2857d9;color:white;padding:10px 16px;font:inherit}button.secondary{background:#edf1f7;color:#35435c}input,textarea,select{width:100%;padding:10px;border:1px solid #dbe2ed;border-radius:7px;font:inherit;margin:6px 0 14px;background:white}textarea{min-height:100px}label{font-weight:600}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid #e9edf4;vertical-align:top}th{color:#63718a;background:#f7f9fc}td[contenteditable]{min-width:80px}video{width:100%;max-height:420px;background:#111827;border-radius:8px} .bar{height:12px;background:#e9eef8;border-radius:8px;margin:6px 0 15px}.bar i{display:block;background:#5679df;height:100%;border-radius:8px}.tag{background:#eaf0ff;color:#2857d9;border-radius:20px;padding:4px 10px;font-size:12px}.notice{background:#fff8e8;color:#805d19;padding:12px;border-radius:8px;margin-bottom:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.scroll{overflow:auto}img.thumb{width:82px;border-radius:5px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere} @media(max-width:800px){aside{position:static;width:auto}nav{display:flex;overflow:auto}nav button{min-width:100px}main{margin:0;padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}</style><style>body{background:#0c0d10;color:#f3f4f6}aside,section,.card{background:#17181d;border-color:#2a2c34}aside h2,.num{color:#25f4ee}nav button{background:transparent;color:#b0b2be}nav button.active{background:#30202a;color:#ff5071;border-left:3px solid #fe2c55}button{background:#fe2c55;font-weight:600}button.secondary{background:#292b34;color:#f4f4f6}input,textarea,select{background:#101116;color:#f5f5f5;border-color:#373944}small,.muted{color:#a2a4b0}.tag{background:#292b34;color:#25f4ee}.notice{background:#24202a;color:#f1baca}th{background:#22232b;color:#b9bac4}td,th{border-color:#30313a}.bar{background:#30313a}.bar i{background:#25f4ee}.shot{display:grid;grid-template-columns:155px 1fr;gap:22px;padding:18px 0;border-bottom:1px solid #30313a}.shot video{aspect-ratio:9/16;object-fit:contain;max-height:245px}.shot h3{color:#25f4ee;margin:0 0 8px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:#101116;padding:10px;border-radius:7px;min-height:65px}.field small{display:block;color:#a2a4b0}.shot button{margin-top:6px;width:100%}.shot [contenteditable]{outline:none;white-space:pre-wrap}.shot [contenteditable]:focus{outline:1px solid #25f4ee}.num{font-variant-numeric:tabular-nums}.metric-note{color:#a2a4b0;font-size:12px}.shot .frames img{width:52px;aspect-ratio:9/16;object-fit:cover;margin:4px;border-radius:4px}@media(max-width:650px){.shot{grid-template-columns:100px 1fr;gap:10px}.fields{grid-template-columns:1fr}}</style><style>body{background:#f6f7f9;color:#20232b}aside,section,.card{background:#fff;border-color:#e6e8ed}aside h2{color:#20232b}nav button{color:#626875}nav button.active{background:#fff0f3;color:#df2450;border-left:3px solid #fe2c55}button{background:#e92952}button.secondary{background:#f0f2f5;color:#333b48}input,textarea,select{background:white;color:#20232b;border-color:#dfe3ea}small,.muted,.metric-note,.field small{color:#687382}.tag{background:#e8f9f6;color:#087d76}.notice{background:#fff4e9;color:#805519}th{background:#f7f8fa;color:#626875}td,th,.shot{border-color:#e8eaf0}.bar{background:#edf0f3}.bar i{background:#13b9ae}.num,.shot h3{color:#20232b}.field{background:#f6f7f9}.shot{grid-template-columns:190px 1fr}.shot video{max-height:310px}.shot [contenteditable]:focus{outline:1px solid #15b9ae}.grid .card{margin:0}.grid{margin-bottom:16px}.mini{display:flex;gap:12px;flex-wrap:wrap}.mini .card{flex:1;min-width:180px}.timeline{display:flex;gap:4px;margin:12px 0}.timeline span{padding:9px 4px;text-align:center;background:#e5f8f6;color:#116e68;border-radius:6px;font-size:12px}.timeline span:first-child{background:#ffe4eb;color:#ad2343}.framegallery{display:flex;gap:8px;overflow:auto}.framegallery img{width:76px;border-radius:8px}.framegallery div{flex:none;text-align:center}.pill{font-size:12px;color:#a04a16}.shot .frames img{width:48px}.wide{grid-column:1/-1}button:disabled{opacity:.5}h3{font-size:17px}@media(max-width:650px){.shot{grid-template-columns:110px 1fr}}</style><aside><h2>◈ TK Studio V5</h2><p class="muted">AI 视频内容生产中心</p><nav id="nav"></nav><hr><small>本地工作台 · 可选联网接口<br>数据保存在当前浏览器</small></aside><main><header><div><h1 id="title"></h1><small>从竞品洞察到原创拍摄执行</small></div><span class="tag" id="status">本地模式</span></header><div id="view"></div></main><script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('tk_'+k))??d}catch{return d}},save=(k,v)=>localStorage.setItem('tk_'+k,JSON.stringify(v));let library=load('library',[]),scripts=load('scripts',[]),rules=load('rules',{}),config=load('config',{endpoint:document.querySelector('meta[name="tk-api-base"]')?.content||(location.protocol==='http:'?location.origin+'/api':'')}),rows=[],frames=[],file=null,url='',current=0;const pages=['数据总览','视频拆解','爆款素材库','脚本创作','分镜管理','企业知识库','接口配置'];function show(i){current=i;$('title').textContent=pages[i];$('status').textContent=config.endpoint?'已配置接口（未验证）':'本地模式';$('nav').innerHTML=pages.map((p,j)=>`<button class="${i===j?'active':''}" onclick="show(${j})">${['▦','▷','◉','✎','▤','▣','⚙'][j]}　${p}</button>`).join('');[dashboard,analysis,lib,create,manage,knowledge,settings][i]()};function render(s){$('view').innerHTML=s}function dashboard(){render(`<div class="grid">${[['已保存视频',library.length],['原创脚本',scripts.length],['待拍摄',scripts.filter(x=>x.state!=='完成').length],['播放≥10万样本',library.filter(x=>Number(x.views)>=100000).length]].map(([a,b])=>`<div class="card"><small>${a}</small><div class="num">${b}</div></div>`).join('')}</div><section><h3>内容类型分布</h3>${['痛点营销','产品实测','前后对比','UGC口播','剧情植入','其他'].map(t=>{let n=library.filter(x=>x.type===t).length;return `${t}　${n} 条<div class="bar"><i style="width:${library.length?n/library.length*100:0}%"></i></div>`}).join('')}</section><section><h3>素材表现对比</h3><div class="scroll"><table><thead><tr><th>素材</th><th>播放量</th><th>点赞量</th><th>点赞率</th></tr></thead><tbody>${library.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.views||'未录入')}</td><td>${esc(x.likes||'未录入')}</td><td>${Number(x.views)>0&&x.likes!==''&&x.likes!=null?(100*Number(x.likes)/Number(x.views)).toFixed(2)+'%':'—'}</td></tr>`).join('')}</tbody></table></div></section><section><h3>开始工作</h3><p>导入视频 → 提取关键帧及字幕 → 分析结构 → 保存素材 → 生成原创分镜</p><button onclick="show(1)">新建拆解任务</button> <button class="secondary" onclick="demo()">载入模拟案例</button></section>`)}function demo(){file=null;url='';frames=[];rows=[['0–3','传统榨汁机难清洗','Still using this?','特写','冲击音','钩子'],['3–8','展示清洗过程','It takes forever.','第一视角','环境音','痛点'],['8–18','便携榨汁机实测','Just add, blend and go.','近景','机器声','卖点证明'],['18–25','展示成品','Fresh juice, anytime.','特写','轻快音乐','结果'],['25–30','手持产品','Check it out below.','中景','提示音','CTA']];show(1);$('name').value='模拟案例：便携榨汁机';$('type').value='产品实测';$('message').textContent='模拟案例，非真实视频分析。'}function analysis(){render(`<div class="notice">本地可播放视频、提取关键帧、解析SRT与编辑分镜。自动理解画面、语音转录与TK链接获取需配置后端。</div><div class="two"><section><h3>视频预览</h3><video id="video" controls ${url?`src="${esc(url)}"`:''}></video><label>上传 MP4 / MOV / WebM</label><input type="file" accept="video/*" onchange="pick(this.files[0])"><label>或输入 TikTok 链接</label><input id="link" placeholder="https://www.tiktok.com/@.../video/..."><button onclick="remote()">联网获取视频信息</button><p id="message" class="muted"></p></section><section><h3>拆解任务</h3><label>视频名称</label><input id="name" value="${esc(file?.name||'')}"><label>内容类型</label><select id="type">${['痛点营销','产品实测','前后对比','UGC口播','剧情植入','其他'].map(x=>`<option>${x}</option>`)}</select><div class="grid" style="grid-template-columns:1fr 1fr"><div><label>播放量（选填）</label><input id="views" type="number" min="0"></div><div><label>点赞量（选填）</label><input id="likes" type="number" min="0"></div></div><label>导入 SRT 字幕</label><input type="file" accept=".srt,.txt" onchange="readSrt(this.files[0])"><label>抽帧间隔（秒）</label><input id="interval" type="number" value="3" min="1" max="60"><div class="actions"><button onclick="extract()">提取关键帧</button><button onclick="aiAnalyze()">AI 智能拆解</button><button class="secondary" onclick="demo()">模拟案例</button></div></section></div><section><h3>关键帧</h3><div id="frames" style="display:flex;gap:10px;flex-wrap:wrap"></div></section><section><h3>AI 内容诊断</h3><div id="diagnosis" class="muted">AI分析后展示开头钩子、结构、优势、风险、优化建议。</div></section><section><h3>逐镜头脚本拆解</h3><div class="actions"><button class="secondary" onclick="rows.push(['','','','','','']);drawRows()">＋ 添加分镜</button><button onclick="storeVideo()">保存到素材库</button><button class="secondary" onclick="csv(rows,'视频拆解')">导出 CSV</button></div><div id="rows" class="scroll"></div></section>`);drawRows();drawFrames()}function pick(f){if(!f)return;file=f;if(url.startsWith('blob:'))URL.revokeObjectURL(url);url=URL.createObjectURL(f);$('video').src=url;$('name').value=f.name;frames=[];rows=[];drawRows();drawFrames()}function drawRows(){if(!$('rows'))return;$('rows').innerHTML=table(rows,true)}function table(data,edit=false){return `<table><thead><tr>${['时间轴(s)','画面/动作','原文台词','镜头语言','音效','营销目的'].map(x=>`<th>${x}</th>`).join('')}${edit?'<th>操作</th>':''}</tr></thead><tbody>${data.map((r,i)=>`<tr>${Array.from({length:6},(_,j)=>`<td ${edit?`contenteditable onblur="rows[${i}][${j}]=this.textContent"`:''}>${esc(r[j])}</td>`).join('')}${edit?`<td><button class="secondary" onclick="rows.splice(${i},1);drawRows()">删除</button></td>`:''}</tr>`).join('')}</tbody></table>${data.length?'':'<p class="muted">暂无分镜，请导入字幕、添加分镜或使用AI分析。</p>'}`}async function readSrt(f){if(!f)return;let s=await f.text();rows=s.trim().split(/\r?\n\s*\r?\n/).map(b=>{let l=b.split(/\r?\n/),i=l.findIndex(x=>x.includes('-->'));return i<0?null:[l[i],'',l.slice(i+1).join(' '),'','','']}).filter(Boolean);drawRows()}function drawFrames(){if($('frames'))$('frames').innerHTML=frames.map((f,i)=>`<div><img class="thumb" src="${f.image}" onclick="$('video').currentTime=${f.time}"><br><small>${f.time.toFixed(1)}s</small></div>`).join('')||'<small>尚未提取关键帧</small>'}async function extract(){let v=$('video');if(!v.duration||!Number.isFinite(v.duration))return alert('请先上传并加载视频');v.pause();const step=Math.max(1,Number($('interval').value)||3),c=document.createElement('canvas');c.width=240;c.height=Math.round(240*v.videoHeight/v.videoWidth);frames=[];let times=Array.from({length:Math.min(80,Math.ceil(v.duration/step))},(_,i)=>Math.min(v.duration-.05,i*step+.05));try{for(let t of times){if(Math.abs(v.currentTime-t)>.001 || v.readyState<2)await new Promise((resolve,reject)=>{let timer=setTimeout(()=>reject(Error('抽帧超时')),5000);v.onseeked=()=>{clearTimeout(timer);resolve()};v.currentTime=t});c.getContext('2d').drawImage(v,0,0,c.width,c.height);frames.push({time:t,image:c.toDataURL('image/jpeg',.65)});drawFrames()}$('message').textContent=`已提取 ${frames.length} 张关键帧（单次最多80张）`;if(!rows.length){rows=frames.map((f,i)=>[`${f.time.toFixed(1)}–${Math.min(v.duration,f.time+step).toFixed(1)}`,'','','','','']);drawRows()}}catch(e){$('message').textContent='抽帧失败：'+e.message}}function storeVideo(){if(!rows.length)return alert('请先添加分镜');library.push({name:$('name').value||'未命名视频',type:$('type').value,views:$('views').value,likes:$('likes').value,link:$('link').value,rows:JSON.parse(JSON.stringify(rows)),date:new Date().toISOString().slice(0,10)});save('library',library);alert('已保存分镜和元数据，不含原视频')}function lib(){render(`<section><h3>素材库</h3><input placeholder="搜索视频名称或类型" oninput="filterLib(this.value)"><div id="liblist"></div><button class="secondary" onclick="csv(library.map(x=>[x.name,x.type,x.views,x.likes,x.link,x.date]),'素材库',['名称','类型','播放','点赞','链接','日期'])">导出素材清单</button></section>`);filterLib('')}function filterLib(q){$('liblist').innerHTML=library.map((x,i)=>({x,i})).filter(({x})=>(x.name+x.type).includes(q)).map(({x,i})=>`<div class="card"><b>${esc(x.name)}</b>　<span class="tag">${esc(x.type)}</span><p>播放 ${esc(x.views||'未填写')} · 点赞 ${esc(x.likes||'未填写')} · ${x.rows.length} 个分镜</p><details><summary>查看拆解</summary>${table(x.rows)}</details><div class="actions"><button onclick="show(3);$('ref').value=${i}">以此结构创作</button><button class="secondary" onclick="library.splice(${i},1);save('library',library);lib()">删除</button></div></div>`).join('')||'暂无素材'}function create(){render(`<section><h3>原创脚本生成</h3><label>产品名称</label><input id="product" value="${esc(rules.product||'')}"><label>产品真实卖点</label><textarea id="selling">${esc(rules.selling||'')}</textarea><label>参考视频</label><select id="ref"><option value="-1">不使用参考视频</option>${library.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`)}</select><div class="grid"><div><label>目标市场</label><input id="market" value="${esc(rules.market||'美国')}"></div><div><label>类型</label><select id="style">${['痛点营销','产品实测','前后对比','UGC口播','剧情植入'].map(x=>`<option>${x}</option>`)}</select></div><div><label>时长（秒）</label><select id="duration"><option>15</option><option selected>30</option><option>45</option><option>60</option></select></div><div><label>输出数量（AI模式）</label><select id="count"><option>1</option><option>3</option><option>5</option></select></div></div><div class="actions"><button onclick="generate(true)">AI 生成原创脚本</button><button class="secondary" onclick="generate(false)">生成本地模板（1条）</button></div><div id="result"></div></section>`)}async function generate(ai){let p=$('product').value,s=$('selling').value,d=Number($('duration').value),style=$('style').value,market=$('market').value;if(!p||!s)return alert('请输入产品和卖点');let data;if(ai){try{data=await request('generate',{product:p,selling:s,duration:d,style,market,count:Number($('count').value),reference:library[Number($('ref').value)]?.rows,rules});if(!Array.isArray(data.scripts)||!data.scripts.every(x=>Array.isArray(x.rows)))throw Error('接口返回格式错误');}catch(e){return alert(e.message)}}else{let t=[0,.1,.27,.6,.83,1].map(x=>Math.round(x*d));data={scripts:[{name:p+' · '+style+'（本地模板）',rows:[[`${t[0]}–${t[1]}`,'展示目标用户问题','[Hook: describe the real problem]','特写','冲击音','钩子'],[`${t[1]}–${t[2]}`,'展示实际使用场景','[Describe the problem]','中景','环境音','痛点'],[`${t[2]}–${t[3]}`,`演示${p}：${s}`,'[Demonstrate verified features]','近景','实测原声','功能证明'],[`${t[3]}–${t[4]}`,'展示真实使用结果','[Show the actual result]','特写','轻音乐','价值'],[`${t[4]}–${t[5]}`,'产品收尾','Check it out.','中景','提示音','CTA']]}]}}for(let x of data.scripts)scripts.push({...x,state:'待拍摄'});save('scripts',scripts);$('result').innerHTML='<p>已保存至分镜管理。</p>'+data.scripts.map(x=>`<h3>${esc(x.name)}</h3>${table(x.rows)}`).join('')}function manage(){render(`<section><h3>拍摄脚本管理</h3>${scripts.map((x,i)=>`<div class="card"><h3>${esc(x.name)}</h3><select onchange="scripts[${i}].state=this.value;save('scripts',scripts)">${['待拍摄','拍摄中','待剪辑','完成'].map(s=>`<option ${s===x.state?'selected':''}>${s}</option>`)}</select>${table(x.rows)}<div class="actions"><button onclick="csv(scripts[${i}].rows,scripts[${i}].name)">导出分镜</button><button class="secondary" onclick="scripts.splice(${i},1);save('scripts',scripts);manage()">删除</button></div></div>`).join('')||'暂无脚本'}</section>`)}function knowledge(){render(`<section><h3>企业规则</h3>${[['product','产品名称'],['selling','经过验证的产品卖点'],['market','目标市场'],['audience','目标用户'],['brand','品牌风格'],['limits','拍摄资源与预算'],['ban','禁用词与合规限制']].map(([k,v])=>`<label>${v}</label><textarea id="r_${k}">${esc(rules[k]||'')}</textarea>`).join('')}<button onclick="saveRules()">保存企业规则</button></section>`)}function saveRules(){document.querySelectorAll('[id^=r_]').forEach(e=>rules[e.id.slice(2)]=e.value);save('rules',rules);alert('已保存')}function settings(){render(`<section><h3>联网与AI接口</h3><p>V5 自带本地后端：启动 server.py 后访问 http://127.0.0.1:8765，默认接口 /api。模型密钥只保存在服务端环境变量中。</p><p>连接你自己的后端服务。不要把模型密钥写入网页。</p><label>后端 HTTPS 地址（本地也可使用 localhost）</label><input id="endpoint" value="${esc(config.endpoint||'')}" placeholder="https://your-server.example/api"><button onclick="config.endpoint=$('endpoint').value.trim().replace(/\/$/,'');save('config',config);show(6)">保存配置</button><button class="secondary" onclick="test()">测试连接</button><p id="test"></p><hr><h3>接口协议</h3><pre>GET /health → {"ok":true}\nPOST /analyze → {"rows":[["0–3","画面","台词","镜头","音效","目的"]]}\nPOST /generate → {"scripts":[{"name":"脚本名称","rows":[[...]]}]}\nPOST /fetch → {"name":"视频名称","views":0,"likes":0,"videoUrl":"可播放的授权视频地址"}</pre><p>后端需要允许当前网页的跨域请求。AI拆解会发送当前字幕、关键帧和企业规则；不会自动发送 function drawManage(){$('tasks').innerHTML=scripts.map((x,i)=>({x,i})).filter(({x})=>$('statefilter').value==='全部'||x.state===$('statefilter').value).map(({x,i})=>`<div class="card"><h3>${esc(x.name)}</h3><div class="two"><div><label>负责人</label><input value="${esc(x.owner||'')}" onchange="scripts[${i}].owner=this.value;save('scripts',scripts)"></div><div><label>执行状态</label><select onchange="scripts[${i}].state=this.value;save('scripts',scripts);manage()">${['待拍摄','拍摄中','待剪辑','完成'].map(s=>`<option ${s===x.state?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="scroll"><table><thead><tr>${['时间','画面','台词','镜头','音效','目的'].map(v=>`<th>${v}</th>`).join('')}</tr></thead><tbody>${x.rows.map((r,j)=>`<tr>${r.map((v,k)=>`<td contenteditable onblur="scripts[${i}].rows[${j}][${k}]=this.textContent;save('scripts',scripts)">${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="actions"><button onclick="csv(scripts[${i}].rows,scripts[${i}].name)">导出拍摄表</button><button class="secondary" onclick="scripts[${i}].rows.push(['','','','','','']);save('scripts',scripts);drawManage()">添加镜头</button><button class="secondary" onclick="scripts.splice(${i},1);save('scripts',scripts);manage()">删除任务</button></div></div>`).join('')||'暂无匹配任务'};
const k5=knowledge;knowledge=function(){k5();$('view').insertAdjacentHTML('beforeend','<section><h3>企业规则文件</h3><p>导入 JSON 规则（product、selling、market、audience、brand、limits、ban），供脚本创作及AI分析使用。</p><input type="file" accept=".json" onchange="importRules(this.files[0])"><button class="secondary" onclick="download(JSON.stringify(rules,null,2),\'企业规则.json\',\'application/json\')">导出规则</button></section>')};async function importRules(f){try{let a=JSON.parse(await f.text());for(let k of ['product','selling','market','audience','brand','limits','ban'])if(typeof a[k]==='string')rules[k]=a[k];save('rules',rules);knowledge()}catch(e){alert('规则导入失败：'+e.message)}}
const settings5=settings;settings=function(){settings5();$('view').insertAdjacentHTML('afterbegin',`<section><h3>服务状态与使用模式</h3><div class="mini"><div class="card"><b>本地演示</b><p>可直接使用 · 不需要密钥</p></div><div class="card"><b>AI模型</b><p>默认 GPT-4.1 mini · 需服务端密钥</p></div><div class="card"><b>TikTok 数据</b><p>需官方授权或第三方内容服务</p></div></div><p>启动完整包中的本地服务后，自动连接 /api；密钥只在服务端环境变量中配置。</p></section>`)};
quickDemo();

const a6=analysis;analysis=function(){a6();$('view').insertAdjacentHTML('afterbegin',`<section><h3>V7 本地自动处理</h3><p>上传有权使用的视频，自动检测切镜、提取画面及尝试语音识别。AI分析需要有效模型密钥。</p><input id="v6file" type="file" accept="video/mp4"><button onclick="processV6()">自动处理本地视频</button><p id="v6status"></p></section>`)};async function processV6(){let f=$('v6file').files[0];if(!f)return;$('v6status').textContent='处理中…';try{let r=await fetch('/api/process',{method:'POST',body:f});let a=await r.json();if(!r.ok)throw Error(a.error);url=a.videoUrl;$('video').src=url;rows=a.rows;frames=a.frames;drawRows();drawFrames();if(a.summary)$('diagnosis').textContent=Object.values(a.summary).join('｜');$('v6status').textContent=a.note}catch(e){$('v6status').textContent=e.message}};if(location.protocol==='http:')config.endpoint=location.origin+'/api';quickDemo();
let result7=null,busy7=false;
const demo7=quickDemo; quickDemo=demo=function(){result7=null;demo7()};
const old7=analysis;analysis=function(){old7();if($('v6file'))$('v6file').closest('section').remove();$('view').insertAdjacentHTML('afterbegin',`<section style="border-top:3px solid #fe2c55"><h3>一键获取视频并自动拆解 · V7</h3><p>无需付费 API。安装本地组件后，可尝试获取有权下载的 TikTok 视频。</p><input id="v7link" placeholder="粘贴完整 TikTok 视频链接" value="${esc(result7?.link||'')}"><div class="actions"><label><input id="permit7" type="checkbox" style="width:auto"> 我有权下载及分析此视频</label><label><input id="asr7" type="checkbox" checked style="width:auto"> 本地语音识别</label><label><input id="ai7" type="checkbox" checked style="width:auto"> 本地 AI 深度拆解</label></div><div class="actions"><button onclick="start7(true)">链接一键拆解</button><button class="secondary" onclick="quickDemo()">完整体验案例</button></div><label>备用：上传有权使用的视频（≤150MB，10分钟以内）</label><input id="upload7" type="file" accept="video/*"><button onclick="start7(false)">处理本地视频</button><p id="stage7" style="color:#d92c55;font-weight:600">${esc(result7?.note||'等待任务；演示内容不是真实采集结果。')}</p><div id="exports7"></div></section>`);if(result7)apply7(result7,false);if($('runQuick'))$('runQuick').onclick=()=>{$('v7link').value=$('quicklink').value;start7(true)};if($('message')&&!activeDemo)$('message').textContent='原视频及分镜由本地服务处理；使用页面顶部的一键入口。';};
function apply7(a,redraw=true){result7=a;activeDemo=false;file=null;url=a.videoUrl;rows=a.rows;frames=a.frames;savedSummary=a.summary;taskMeta=a;if($('video'))$('video').src=tkAsset(url);if($('name'))$('name').value=a.name||'';if($('link'))$('link').value=a.link||'';if($('quicklink'))$('quicklink').value=a.link||'';if($('metrics'))metrics(a);if($('progress'))$('progress').textContent=a.source||'';if($('quicksummary'))$('quicksummary').textContent=`${a.clips.length} 个候选镜头 · ${a.duration.toFixed(1)}秒 · ${a.aiCount} 个 AI 分析`;diagnosis();drawRows();drawFrames();if($('stage7'))$('stage7').textContent=a.note;if($('exports7'))$('exports7').innerHTML=`<div class="actions"><a href="${esc(tkAsset(a.originalUrl))}" download="original.mp4">下载完整 MP4</a>　<a href="${esc(tkAsset(a.reportUrl))}" download>导出 Excel</a>　<a href="${esc(tkAsset(a.zipUrl))}" download>全部分镜 ZIP</a>　<a href="${esc(tkAsset(a.originalUrl.replace('original.mp4','transcript.srt')))}" download>字幕 SRT</a></div>`;}
const tkApiBase=()=>{const m=document.querySelector('meta[name="tk-api-base"]')?.content.trim();return (m||config.endpoint||'').replace(/\/$/,'')};const tkUrl=p=>{const b=tkApiBase();return (b?b:'')+p};const tkAsset=p=>{if(!p)return p;return /^https?:\/\//i.test(p)?p:(tkApiBase()+p)};
async function tkJson(r){if(!(r.headers.get('content-type')||'').includes('application/json'))throw Error('未连接正确的 TK Studio 后端，请检查后端地址');return await r.json()}
async function tkHealth(){let r=await fetch(tkUrl('/health'),{cache:'no-store'});let j=await tkJson(r);if(!r.ok||j.service!=='tk-studio-v7-fix')throw Error('当前地址不是 TK Studio 后端');return j}
async function start7(isLink){if(busy7)return;if(location.protocol==='file:'){alert('直接打开 HTML 仅可演示。请解压完整包并运行启动工作台.bat。');return}let link=$('v7link').value.trim(),f=$('upload7').files[0],permission=$('permit7').checked,ai=$('ai7').checked,asr=$('asr7').checked;if(isLink&&(!permission||!link))return alert('请输入链接并确认有权使用');if(!isLink&&!f)return alert('请选择视频');busy7=true;result7=null;activeDemo=false;rows=[];frames=[];savedSummary=null;taskMeta={};url='';$('video').removeAttribute('src');$('video').load();metrics({});drawRows();drawFrames();diagnosis();$('exports7').innerHTML='';$('quicksummary').textContent='';$('progress').textContent='真实任务处理中';let say=s=>{if($('stage7'))$('stage7').textContent=s};say('检测 TK Studio 后端…');try{let health=await tkHealth();if(!health.ffmpeg)throw Error('缺少 FFmpeg，请运行安装组件.bat 后重新启动');say('提交任务…');let r=await fetch(tkUrl(isLink?'/link':`/upload?ai=${+ai}&asr=${+asr}`),{method:'POST',headers:isLink?{'Content-Type':'application/json'}:{},body:isLink?JSON.stringify({url:link,permission,ai,asr}):f});let j=await tkJson(r);if(!r.ok)throw Error(j.error);for(;;){await new Promise(r=>setTimeout(r,1200));let k=await fetch(tkUrl('/jobs/'+j.id));let a=await tkJson(k);if(!k.ok)throw Error(a.error);say(a.stage);if(a.status==='failed')throw Error(a.error);if(a.status==='done'){result7=a.result;if(current===1)apply7(a.result);break}}}catch(e){say('失败：'+e.message+'；不会生成虚假拆解。');if($('progress'))$('progress').textContent='真实任务失败'}finally{busy7=false}}
const rows7=drawRows;drawRows=function(){rows7();if(!result7||!$('rows'))return;$('rows').innerHTML=result7.clips.map((c,i)=>`<div class="shot" style="display:grid;grid-template-columns:180px 1fr;gap:18px;margin:16px 0;padding:16px;border:1px solid #e4e7ed;border-radius:12px"><div><video controls preload="metadata" src="${esc(tkAsset(c.url))}" style="width:100%;max-height:300px;background:#111"></video><p>${c.start.toFixed(2)}–${c.end.toFixed(2)}s</p><a download href="${esc(tkAsset(c.url))}">下载此镜头 MP4</a></div><div><b>SHOT ${String(i+1).padStart(2,'0')}</b><div style="display:flex;gap:8px;margin:12px 0">${c.frames.map(p=>`<img src="${esc(p)}" style="width:70px;border-radius:5px">`).join('')}</div><div class="fields">${['时间','画面动作','原文及中文翻译','镜头及剪辑','音效','营销目的'].map((k,j)=>`<div class="field"><small>${k}</small><div contenteditable onblur="rows[${i}][${j}]=this.textContent">${esc(rows[i][j])}</div></div>`).join('')}<div class="field"><small>复拍建议</small><div>${esc(c.detail.reshoot||'未分析')}</div></div></div></div></div>`).join('')};
const save7=storeVideo;storeVideo=function(){let n=library.length;save7();if(result7&&library.length>n){Object.assign(library.at(-1),{result7:{...result7,frames:[]},summary:result7.summary,source:result7.source});save('library',library)}};

const settings7=settings;settings=function(){settings7();$('view').insertAdjacentHTML('afterbegin','<section><h3>V7 本地组件检查（无需 API Key）</h3><p id="health7">点击检测查看实际状态。</p><button onclick="health7()">检测本地服务</button><p>模型默认 qwen2.5vl:3b，语音 small；首次需联网下载，安装后可本地运行。</p></section>')};async function health7(){try{let j=await tkHealth();$('health7').textContent=`FFmpeg：${j.ffmpeg?'已安装':'未安装'}｜采集组件：${j.collector?'已安装':'未安装'}｜Whisper：${j.whisper?'组件已安装':'未安装'}｜本地视觉模型：${j.configured?'已找到':'未找到'}。组件存在不代表实测成功。`}catch(e){$('health7').textContent='请启动本地服务'}};
